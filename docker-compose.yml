# Galaxy stack: Postgres (users) + FastAPI (API, deals SQLite, roster JSON) + nginx (SPA + /api proxy).
#   cp .env.docker.example .env      # fill in, never commit
#   docker compose up -d --build     # http://localhost:${WEB_PORT}
# App secrets (SECRET_KEY, VTIGER_*) come from backend/.env, same file as the non-Docker deploy.
name: galaxy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    # These win over backend/.env so a host DATABASE_URL never leaks into the container.
    # Driver is explicit: SQLAlchemy >= 2.1 maps bare postgresql:// to psycopg 3, which is not installed.
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GALAXY_DEALS_DB: /app/var/galaxy.db
    volumes:
      - deals:/app/var
      - config:/app/config
      - quota_data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - backend

volumes:
  # Back up pgdata, deals and config. quota_data is regenerated by Sync / Rebuild.
  pgdata:
  deals:
  config:
  quota_data:
